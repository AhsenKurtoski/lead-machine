name: Dependency review

# Dependabot avvisa, ma una PR può comunque introdurre una dipendenza
# vulnerabile. Questo controllo blocca la PR se una nuova dipendenza porta
# vulnerabilità high/critical note, prima del merge.
#
# Il repository è pubblico: dependency-review-action non richiede GHAS.

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: Dipendenze nuove senza vulnerabilità note
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
