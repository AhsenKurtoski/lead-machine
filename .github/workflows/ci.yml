name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Audit settimanale delle dipendenze (lunedì 08:00 UTC)
    - cron: "0 8 * * 1"

jobs:
  app:
    name: App — typecheck, lint, i18n, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Typecheck, lint e parità i18n (7 lingue)
        run: npm run qa
      - name: Build di produzione
        run: npm run build

  smoke-api:
    name: API key end-to-end (smoke:api)
    runs-on: ubuntu-latest
    needs: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Database + seed
        run: npm run setup
      - name: Avvia il server
        run: |
          npx next dev -p 3111 &
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3111/api/settings || true)
            if [ "$code" != "000" ]; then echo "server pronto (HTTP $code)"; break; fi
            sleep 2
          done
      - name: Smoke test API key (31 assert)
        run: SMOKE_BASE=http://localhost:3111 npm run smoke:api

  audit:
    name: Audit dipendenze (settimanale)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=critical
