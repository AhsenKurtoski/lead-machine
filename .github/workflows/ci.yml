name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Audit settimanale delle dipendenze (lunedì 08:00 UTC)
    - cron: "0 8 * * 1"

jobs:
  app:
    name: App — test unitari, typecheck, lint, i18n, build
    runs-on: ubuntu-latest
    # Il repository non committa un `.env` (conterrebbe segreti) e Prisma non ha
    # un default per `DATABASE_URL`: senza questa variabile ogni comando Prisma
    # muore con `You must provide a nonempty URL`.
    env:
      DATABASE_URL: file:./dev.db
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit dipendenze (critical/high)
        run: npm audit --omit=dev --audit-level=high
      - run: npx prisma generate
      - name: "QA: test unitari, typecheck, lint, i18n e allineamento D1/Prisma"
        # `npm run qa` include `check:schema`, lo stesso comando che si lancia
        # in locale: le migrazioni in migrations/*.sql, applicate a un SQLite
        # temporaneo, devono dare esattamente prisma/schema.prisma. Il database
        # online nasce dalle migrazioni, quello locale da `prisma db push`: se
        # divergono le API si rompono solo dopo il deploy.
        run: npm run qa
      - name: Build di produzione
        run: npm run build
      - name: Database per auth smoke
        run: npm run setup
      - name: Auth, CSRF, header e fail-closed
        run: npm run check:auth

  workers:
    name: Worker Cloudflare — build OpenNext e smoke con D1 locale
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Nessuna credenziale Cloudflare: build e wrangler dev girano in locale.
    # Il job esiste perché il target online del progetto è Workers + D1 e il
    # solo `next build` non prova il percorso di deploy: il build OpenNext si
    # rompe a ogni bump di Next o dell'adapter, e lo si scoprirebbe solo al
    # momento del deploy, con il database già migrato.
    env:
      # Prisma vuole un URL anche quando i dati vivono in D1: senza questa
      # variabile `prisma generate` e il build falliscono.
      DATABASE_URL: file:./dev.db
      # Next incorpora questo valore nel bundle: va impostato prima del build.
      NEXT_PUBLIC_BASE_URL: http://127.0.0.1:8799
      CI: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Wrangler 4 richiede Node 22 o successivo: con Node 20 la migrazione
          # D1 e `wrangler dev` si fermano prima di partire.
          node-version: 22
          cache: npm

      - name: Installa dipendenze
        run: npm ci

      - name: Genera il client Prisma
        run: npx prisma generate

      - name: Build del Worker (OpenNext)
        run: npm run cf:build

      - name: Migrazioni e seed sul D1 locale
        run: |
          npm run cf:migrate:local
          npm run cf:seed:local

      - name: Backup esportato e ripristinato (D1 locale)
        # `backup:d1` produce il dump, ma un backup mai ripristinato non e' un
        # backup: qui il dump viene reimportato in un database vuoto e i dati
        # vengono confrontati. Stesso comando di Wrangler usato in produzione.
        run: npm run check:backup

      - name: Smoke del Worker con binding D1
        env:
          # Password solo per il server effimero del job.
          APP_PASSWORD: ci-worker-password-2026
        run: |
          printf 'APP_PASSWORD=%s\nNEXT_PUBLIC_BASE_URL=http://127.0.0.1:8799\n' "$APP_PASSWORD" > .dev.vars
          npx wrangler dev --port 8799 --ip 127.0.0.1 > /tmp/worker.log 2>&1 &
          ready=0
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:8799/api/health > /dev/null; then ready=1; break; fi
            sleep 3
          done
          if [ "$ready" != "1" ]; then
            echo "Worker non pronto su /api/health"
            cat /tmp/worker.log
            exit 1
          fi
          echo -n "health: "; curl -s http://127.0.0.1:8799/api/health; echo
          dash=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8799/dashboard)
          login=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8799/login)
          echo "dashboard=$dash login=$login"
          if [ "$dash" != "307" ]; then
            echo "atteso 307 su /dashboard (fail-closed senza sessione)"
            cat /tmp/worker.log
            exit 1
          fi
          if [ "$login" != "200" ]; then
            echo "atteso 200 su /login"
            cat /tmp/worker.log
            exit 1
          fi
          # Rate limit condiviso su D1, nel percorso vero di produzione
          # (workerd + binding D1), non sul server Node degli altri job.
          fail=0
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
              -H 'content-type: application/json' -A 'lm-rate-limit-probe' \
              -d '{"password":"sbagliata"}' http://127.0.0.1:8799/api/auth/login)
            if [ "$code" != "401" ]; then echo "tentativo $i: HTTP $code (atteso 401)"; fail=1; fi
          done
          [ "$fail" = "0" ] || { cat /tmp/worker.log; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H 'content-type: application/json' -A 'lm-rate-limit-probe' \
            -d '{"password":"sbagliata"}' http://127.0.0.1:8799/api/auth/login)
          if [ "$code" != "429" ]; then
            echo "11° tentativo: HTTP $code (atteso 429)"
            cat /tmp/worker.log
            exit 1
          fi
          echo "rate limit su D1: 429 dopo 10 tentativi"

      - name: Log del Worker in caso di errore
        if: failure()
        run: |
          if [ -f /tmp/worker.log ]; then cat /tmp/worker.log; else echo "nessun log del Worker"; fi

  smoke-api:
    name: API key end-to-end (smoke:api) e controllo interfaccia
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: app
    env:
      DATABASE_URL: file:./dev.db
      # Password solo per il server effimero del job: smoke-api la usa per
      # autenticare gli endpoint interni, che senza APP_PASSWORD falliscono 503.
      APP_PASSWORD: smoke-ci-password-2026
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build di produzione
        run: npm run build
      - name: Database + seed
        run: npm run setup
      - name: Avvia il server di produzione
        run: |
          PORT=3111 npm start > /tmp/lead-machine-smoke.log 2>&1 &
          ready=0
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3111/api/health || true)
            if [ "$code" = "200" ]; then echo "server pronto (HTTP $code)"; ready=1; break; fi
            sleep 2
          done
          if [ "$ready" != "1" ]; then
            echo "server non pronto"
            cat /tmp/lead-machine-smoke.log
            exit 1
          fi
      - name: Smoke test API key
        run: SMOKE_BASE=http://localhost:3111 npm run smoke:api

      - name: Flussi chiave — dati, import CSV, ricevute, azioni massive
        # Stesso server: crea i propri lead, verifica i valori salvati e le
        # validazioni, e ripulisce da solo (il controllo di igiene qui sotto
        # fallirebbe se restasse qualcosa).
        env:
          SMOKE_BASE: http://localhost:3111
          SMOKE_PASSWORD: smoke-ci-password-2026
        run: npm run test:flows
      - name: Installa Chromium per il controllo dell'interfaccia
        run: npx playwright install --with-deps chromium

      - name: Console e layout su desktop e mobile, tema chiaro e scuro
        # Riusa il server di produzione gia' acceso da questo job: apre tutte
        # le pagine e fallisce su errori in console, idratazione, 401/5xx e
        # overflow orizzontale. Sono le regressioni gia' capitate a mano.
        # `--mobile` aggiunge il giro a 390x844: senza, la regola bloccante
        # sullo scroll orizzontale mobile non verrebbe mai eseguita in CI
        # (e' cosi' che /crm sfondava di 235 px).
        env:
          APP_PASSWORD: smoke-ci-password-2026
          BASE_URL: http://127.0.0.1:3111
        run: npm run check:ui -- --mobile

      - name: Mutazioni dell'interfaccia e dialogo accessibile
        # check:ui apre le pagine ma non clicca nulla che scriva; test:flows
        # usa le API. Qui il browser cambia lo stato di un lead, ricarica e
        # verifica il dato persistito, poi apre il dialogo di eliminazione:
        # nome accessibile, focus dentro, axe, Escape e nessuna cancellazione.
        # Lo stato originale viene ripristinato anche in caso di errore.
        env:
          APP_PASSWORD: smoke-ci-password-2026
          BASE_URL: http://127.0.0.1:3111
        run: npm run check:ui:flows

      - name: Nessun residuo di test nel database
        # `--require-db`: qui il database c'e' per davvero, quindi assente e'
        # un errore; il controllo verifica che gli smoke test non lascino
        # dietro lead, chiavi, verifiche doppie o una coda incoerente.
        run: node --import tsx scripts/check-hygiene.mjs --require-db

  docker:
    name: Docker — build dell'immagine e primo avvio
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Senza un job che costruisca l'immagine, `Dockerfile` e `deploy/` possono
    # rompersi in silenzio: chi prova l'installazione sempre accesa lo scopre
    # solo allora. Qui l'immagine viene costruita e avviata davvero.
    steps:
      - uses: actions/checkout@v7

      - name: Build dell'immagine
        run: docker build -t lead-machine:ci .

      - name: Primo avvio, database e healthcheck
        run: |
          docker run -d --name lead-machine-ci -p 3010:3000 \
            -e APP_PASSWORD=docker-ci-password-2026 lead-machine:ci
          ready=0
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3010/api/health || true)
            if [ "$code" = "200" ]; then echo "healthcheck pronto (HTTP $code)"; ready=1; break; fi
            sleep 3
          done
          if [ "$ready" != "1" ]; then
            echo "il container non risponde su /api/health"
            docker logs lead-machine-ci || true
            exit 1
          fi
          login=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3010/login)
          echo "login=$login"
          if [ "$login" != "200" ]; then
            echo "atteso 200 su /login dopo il primo avvio"
            docker logs lead-machine-ci || true
            exit 1
          fi
          docker exec lead-machine-ci node -e "const fs=require('fs'); process.exit(fs.existsSync('/data/lead-machine.db')?0:1)"
          echo "database creato in /data"

      - name: Log del container in caso di errore
        if: failure()
        run: docker logs lead-machine-ci || true

  live:
    name: Live — smoke geo e performance
    # Solo su schedule o avvio manuale: sono controlli che dipendono da servizi
    # esterni (Overpass, Nominatim) e da una macchina con il server di
    # produzione acceso. Non devono bloccare una pull request.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: file:./dev.db
      APP_PASSWORD: live-ci-password-2026
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build di produzione
        run: npm run build
      - name: Database + seed
        run: npm run setup
      - name: Avvia il server di produzione
        run: |
          PORT=3111 npm start > /tmp/lead-machine-live.log 2>&1 &
          ready=0
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3111/api/health || true)
            if [ "$code" = "200" ]; then echo "server pronto (HTTP $code)"; ready=1; break; fi
            sleep 2
          done
          if [ "$ready" != "1" ]; then
            echo "server non pronto"
            cat /tmp/lead-machine-live.log
            exit 1
          fi
      - name: Smoke geografico live
        run: SMOKE_BASE=http://localhost:3111 SMOKE_PASSWORD="$APP_PASSWORD" npm run smoke:geo
      - name: Performance live
        run: SMOKE_BASE=http://localhost:3111 SMOKE_PASSWORD="$APP_PASSWORD" npm run perf:check
      - name: Log del server in caso di errore
        if: failure()
        run: cat /tmp/lead-machine-live.log

  secret-scan:
    name: Segreti nella storia (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Tutta la storia: un segreto committato mesi fa resta leggibile
          # anche dopo la rimozione dal file attuale.
          fetch-depth: 0
      - name: gitleaks
        shell: bash
        run: |
          if ! command -v gitleaks >/dev/null 2>&1; then
            version=8.24.3
            curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz" \
              | tar -xz -C /usr/local/bin gitleaks
          fi
          gitleaks detect --source . --redact --no-banner --exit-code 1

  audit:
    name: Audit dipendenze (settimanale)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=critical
