name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Audit settimanale delle dipendenze (lunedì 08:00 UTC)
    - cron: "0 8 * * 1"

jobs:
  app:
    name: App — test unitari, typecheck, lint, i18n, build
    runs-on: ubuntu-latest
    # Il repository non committa un `.env` (conterrebbe segreti) e Prisma non ha
    # un default per `DATABASE_URL`: senza questa variabile ogni comando Prisma
    # muore con `You must provide a nonempty URL`.
    env:
      DATABASE_URL: file:./dev.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Audit dipendenze (critical/high)
        run: npm audit --omit=dev --audit-level=high
      - run: npx prisma generate
      - name: Test unitari, typecheck, lint e parità i18n (7 lingue)
        run: npm run qa
      - name: Build di produzione
        run: npm run build
      - name: Database per auth smoke
        run: npm run setup
      - name: Auth, CSRF, header e fail-closed
        run: npm run check:auth

  smoke-api:
    name: API key end-to-end (smoke:api)
    runs-on: ubuntu-latest
    needs: app
    env:
      DATABASE_URL: file:./dev.db
      # Password solo per il server effimero del job: smoke-api la usa per
      # autenticare gli endpoint interni, che senza APP_PASSWORD falliscono 503.
      APP_PASSWORD: smoke-ci-password-2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build di produzione
        run: npm run build
      - name: Database + seed
        run: npm run setup
      - name: Avvia il server di produzione
        run: |
          PORT=3111 npm start > /tmp/lead-machine-smoke.log 2>&1 &
          ready=0
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3111/api/health || true)
            if [ "$code" = "200" ]; then echo "server pronto (HTTP $code)"; ready=1; break; fi
            sleep 2
          done
          if [ "$ready" != "1" ]; then
            echo "server non pronto"
            cat /tmp/lead-machine-smoke.log
            exit 1
          fi
      - name: Smoke test API key
        run: SMOKE_BASE=http://localhost:3111 npm run smoke:api
      - name: Nessun residuo di test nel database
        # `--require-db`: qui il database c'e' per davvero, quindi assente e'
        # un errore; il controllo verifica che gli smoke test non lascino
        # dietro lead, chiavi, verifiche doppie o una coda incoerente.
        run: node --import tsx scripts/check-hygiene.mjs --require-db

  live:
    name: Live — smoke geo e performance
    # Solo su schedule o avvio manuale: sono controlli che dipendono da servizi
    # esterni (Overpass, Nominatim) e da una macchina con il server di
    # produzione acceso. Non devono bloccare una pull request.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: file:./dev.db
      APP_PASSWORD: live-ci-password-2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build di produzione
        run: npm run build
      - name: Database + seed
        run: npm run setup
      - name: Avvia il server di produzione
        run: |
          PORT=3111 npm start > /tmp/lead-machine-live.log 2>&1 &
          ready=0
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3111/api/health || true)
            if [ "$code" = "200" ]; then echo "server pronto (HTTP $code)"; ready=1; break; fi
            sleep 2
          done
          if [ "$ready" != "1" ]; then
            echo "server non pronto"
            cat /tmp/lead-machine-live.log
            exit 1
          fi
      - name: Smoke geografico live
        run: SMOKE_BASE=http://localhost:3111 SMOKE_PASSWORD="$APP_PASSWORD" npm run smoke:geo
      - name: Performance live
        run: SMOKE_BASE=http://localhost:3111 SMOKE_PASSWORD="$APP_PASSWORD" npm run perf:check
      - name: Log del server in caso di errore
        if: failure()
        run: cat /tmp/lead-machine-live.log

  audit:
    name: Audit dipendenze (settimanale)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=critical
